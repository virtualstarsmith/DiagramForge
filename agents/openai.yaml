interface:
  display_name: "DiagramForge"
  short_description: "Business-formal animated architecture, swimlane, graph, and UML (sequence/ER/use-case/class/activity/state/DFD) diagrams in slate, report, academic, or blueprint styles, with an optional hand-drawn sketch mode"
