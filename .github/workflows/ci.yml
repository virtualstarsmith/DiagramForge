name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pin LF endings (SKILL.md byte cap is LF-measured)
        run: git config core.autocrlf false && git rm --cached -r -q . && git reset --hard -q
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Version manifests in sync
        run: python -X utf8 scripts/bump_version.py --check
      - name: Test suite (includes docs-sync, lint-output, adversarial, examples-freshness gates)
        run: python -X utf8 -m pytest tests/ -q --no-header
