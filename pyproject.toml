[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagramforge"
version = "2.3.0"
description = "Hand-drawn animated architecture, swimlane, graph, and UML diagram generator"
readme = "SKILL.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DiagramForge" }]
dependencies = [
    "Pillow>=11.0.0",
    "svg.path>=7.0",
    "fonttools>=4.51",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.49.0",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools]
# DiagramForge is a skill (script + assets), not an installable package.
# This metadata documents dependencies and Python version requirements only.
py-modules = []
